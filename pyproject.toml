[project]
name = "helios-interview-coach"
version = "0.1.0"
description = "Local, offline-capable personal interview coach"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.7,<3", "httpx>=0.27,<1", "python-multipart>=0.0.20",
  "pypdf>=5,<7", "python-docx>=1.1,<2", "keyring>=25,<26",
  "av>=14", "numpy>=1.26,<3", "huggingface-hub>=0.28,<2",
  "faster-whisper>=1.1,<2", "piper-tts>=1.3,<2"
]

[project.optional-dependencies]
speakers = ["pyannote.audio>=4,<5"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
package = false
